level = 1
network = "loopback-only"
allowed_egress = []
# level=1 runs on host/worktree paths, not on a bwrap-mounted /workspace.
# Keep write-path allowlist permissive here until OS-level wrapper is active.
allowed_writes = []
read_only_mounts = ["/usr", "/etc/ssl"]
max_memory_mb = 1024
max_cpu_seconds = 600
